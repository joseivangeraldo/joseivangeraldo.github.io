<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HTTPS Website</title>
    <style>
        /* Basic reset and responsive layout styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
        }
        header {
            background: #35424a;
            color: #ffffff;
            padding: 1rem;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background: #2e383f;
        }
        nav a {
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 14px;
        }
        nav a:hover {
            background: #4f5d65;
        }
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 20px;
            background: #ffffff;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            background: #35424a;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Secure Site</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main class="container">
        <section style="padding: 20px 0;">
            <h2>Secure Content Delivery</h2>
            <p>Este é um site inicial de José Ivan, aonde colacarei meu curriculum e informações profissionais.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Secure Webpage. All Rights Reserved.</p>
    </footer>

</body>
</html>
